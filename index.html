<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Tu barbería</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&display=swap">
<style>
:root{--or:#f26a0f;--bg:#000;--panel:#111;--line:#242424;--line2:#2e2e2e;--ink:#fff;--mute:#8a8a8a;--ok:#34d399;--warn:#e0a400}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:500 16px/1.4 "Bricolage Grotesque",system-ui,sans-serif;min-height:100vh;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
main{max-width:460px;margin:0 auto;padding:22px 20px 70px}
h1{font-size:32px;font-weight:800;letter-spacing:-.5px;margin:6px 0 18px}
.hint{color:var(--mute);font-size:14px;line-height:1.45;margin:14px 0}
.ok{color:var(--ok);font-weight:800;margin:16px 0 0}
.card{background:var(--or);border-radius:28px;padding:22px;box-shadow:0 12px 40px rgba(242,106,15,.4)}
.top{display:flex;justify-content:space-between;gap:10px}
.shop{font-size:21px;font-weight:800;letter-spacing:-.3px}.sub{font-size:12px;opacity:.85}
.count{font-size:38px;font-weight:800;text-align:right;letter-spacing:-1px;line-height:1}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;background:rgba(0,0,0,.28);border-radius:20px;padding:14px;margin:18px 0}
.s{aspect-ratio:1;border-radius:50%;border:2px dashed rgba(255,255,255,.4);display:grid;place-items:center}
.s svg{width:52%;height:52%;fill:#fff;opacity:.5}
.s.on{background:#fff;border:2px solid #fff}.s.on svg{fill:var(--or);opacity:1}
.val{font-size:17px;font-weight:800;display:block}
.row{display:flex;gap:10px;margin-top:14px}
button{font:inherit;font-weight:800;border:0;border-radius:16px;padding:15px 18px;cursor:pointer;background:var(--or);color:#fff}
button.ghost{background:transparent;border:1.5px solid var(--line2)}
button.big{flex:1}
button:focus-visible,input:focus-visible{outline:3px solid #fff;outline-offset:2px}
input{font:inherit;width:100%;padding:14px;border-radius:16px;border:1.5px solid var(--line2);background:var(--panel);color:#fff}
input::placeholder{color:#6b6b6b}
.list{background:var(--panel);border:1px solid var(--line);border-radius:24px;overflow:hidden}
.cl{padding:16px;border-bottom:1px solid var(--line)}.cl:last-child{border:0}
.ct{display:flex;align-items:center;gap:12px}
.av{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#1a1a1a;flex:none}
.n{flex:1;min-width:0}.n b{display:block;font-size:18px}.n small{color:var(--mute)}
.want{color:var(--or);font-weight:800;display:block;margin-top:2px}
.dot{width:14px;height:14px;border-radius:50%;flex:none}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.mini{padding:9px 13px;font-size:14px;border-radius:12px;background:#1a1a1a;border:1.5px solid var(--line2)}
.mini.on{background:var(--or);border-color:var(--or)}
.link{background:none;color:var(--mute);text-decoration:underline;display:block;margin:22px auto 0;font-weight:500}
.empty{padding:24px;text-align:center;color:var(--mute)}
.add{display:grid;grid-template-columns:1fr 80px;gap:10px;margin-top:16px}
.add .full{grid-column:1/-1}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:flex-start;justify-content:center;padding:calc(24px + env(safe-area-inset-top,0)) 14px}
.sheet.open{display:flex}
.note{width:100%;max-width:420px;background:#1b1b1b;border:1px solid var(--line2);border-radius:24px;padding:20px}
.note h2{font-size:28px;line-height:1.1;margin:0 0 6px}.note p{margin:0 0 16px;color:var(--mute)}
.note .row{margin:0}.note .row button{flex:1}
.toast{z-index:9;position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0));transform:translateX(-50%);background:#fff;color:#000;padding:10px 16px;border-radius:14px;display:none;max-width:90%}
.toast.on{display:block}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><symbol id="sc" viewBox="0 0 24 24"><path d="M9.6 7.6A3.5 3.5 0 1 0 7 9.5l2.2 2.5-2.3 2.6a3.5 3.5 0 1 0 1.9 1.6L12 12.5l6 6.4h2.8L10.9 9.6zM6 7a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zm0 13a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zM14.5 10.2l1.6-1.8 4.7-5.4H18z"/></symbol><symbol id="gf" viewBox="0 0 24 24"><path d="M20 7h-2.2a3 3 0 0 0-5.3-3.2A3 3 0 0 0 7.2 7H5a1 1 0 0 0-1 1v3h16V8a1 1 0 0 0-1-1zM9.2 7a1 1 0 1 1 1 1h-1zm5.6 0h-1a1 1 0 1 1 1-1zM5 13v6a1 1 0 0 0 1 1h5v-7zm8 0v7h5a1 1 0 0 0 1-1v-6z"/></symbol></svg>

<main id="app"></main>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="note"><h2 id="sh-t"></h2><p id="sh-p"></p><div class="row" id="sh-b"></div></div></div>
<div class="toast" id="toast" role="status"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getFirestore, doc, collection, onSnapshot, setDoc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

/* ================== CONFIGURA ESTO ================== */
const firebaseConfig = {           // Firebase Console > Configuración del proyecto > Tus apps > Web
  apiKey: "AIzaSyAhhB7A3Q_nN1w7ii2RBoblRMTKYHNJI3s",
  authDomain: "weo-barbers.firebaseapp.com",
  projectId: "weo-barbers",
  appId: "1:93018352487:web:0cfd03b59b561bc683ddc2",
};
const SHOP = { lat: 0, lng: 0, radius: 150 };   // tu barbería (radio en metros); deja 0 para desactivar el aviso de llegada
const GOAL = 10, HALF = Math.floor(GOAL / 2), COOLDOWN_H = 6;
/* ==================================================== */

const fb = initializeApp(firebaseConfig), auth = getAuth(fb), db = getFirestore(fb);
const $ = (s) => document.querySelector(s);
const app = $("#app");
const q = new URLSearchParams(location.search);
const esc = (s = "") => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const store = {
  get: (k) => { try { return localStorage.getItem(k); } catch { return null; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch {} },
};
const COLORS = ["#93c5fd", "#fcd34d", "#fda4af", "#86efac", "#c4b5fd", "#fdba74"];

function toast(m) { const t = $("#toast"); t.textContent = m; t.classList.add("on"); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove("on"), 2400); }
function sheet(title, text, buttons) {
  $("#sh-t").textContent = title; $("#sh-p").textContent = text;
  const b = $("#sh-b"); b.innerHTML = "";
  buttons.forEach((x) => {
    const el = document.createElement("button");
    el.textContent = x.label; if (x.ghost) el.className = "ghost";
    el.onclick = () => { $("#sheet").classList.remove("open"); x.fn && x.fn(); };
    b.appendChild(el);
  });
  $("#sheet").classList.add("open"); b.firstChild.focus();
}
const waLink = (phone, text) => `https://wa.me/${(phone || "").replace(/\D/g, "")}?text=${encodeURIComponent(text)}`;

function cardHTML(c) {
  const slots = Array.from({ length: GOAL }, (_, i) =>
    `<div class="s ${i < c.stamps ? "on" : ""}"><svg><use href="#${i === GOAL - 1 ? "gf" : "sc"}"/></svg></div>`).join("");
  return `<div class="card"><div class="top"><div><div class="shop">Tu barbería</div><div class="sub">Tarjeta de sellos</div></div>
  <div><div class="count">${c.stamps}/${GOAL}</div><div class="sub" style="text-align:right">sellos</div></div></div>
  <div class="grid">${slots}</div>
  <div class="top"><div><div class="sub">Premio</div><span class="val">Un corte gratis</span></div>
  <div style="text-align:right"><div class="sub">Cliente</div><span class="val">${esc(c.name)}</span></div></div></div>`;
}

/* ================== VISTA CLIENTE ================== */
function client() {
  const code = (q.get("c") || store.get("code") || "").trim();
  if (!code) {
    app.innerHTML = `<h1>Tu tarjeta</h1><p class="hint">Escribe el código que te dio tu barbero o abre el enlace que te mandó.</p>
      <input id="cd" placeholder="Código" autocapitalize="none"><div class="row"><button class="big" id="go">Ver mi tarjeta</button></div>`;
    $("#go").onclick = () => { const v = $("#cd").value.trim(); if (v) { store.set("code", v); location.search = "?c=" + encodeURIComponent(v); } };
    return;
  }
  store.set("code", code);
  app.innerHTML = `<h1 id="hi">Tu tarjeta</h1><div id="cv"></div>`;
  let prev = null;
  onSnapshot(doc(db, "clients", code), (d) => {
    if (!d.exists()) { $("#cv").innerHTML = `<p class="hint">Código no válido. Revísalo con tu barbero.</p>`; return; }
    const c = d.data();
    if (prev !== null) {
      if (prev < GOAL && c.stamps >= GOAL) { sheet("¡Tienes un corte gratis!", "Díselo a tu barbero en tu próxima visita.", [{ label: "Ok" }]); navigator.vibrate?.(200); }
      else if (prev < HALF && c.stamps >= HALF && c.stamps < GOAL) { sheet("¡Tienes 50%!", "Ya vas por la mitad de tu tarjeta.", [{ label: "Ok" }]); navigator.vibrate?.(200); }
    }
    prev = c.stamps;
    $("#hi").textContent = "Hola, " + c.name;
    const msg = c.stamps >= GOAL ? `<p class="ok">¡Tienes un corte gratis! Díselo a tu barbero.</p>`
      : c.stamps >= HALF ? `<p class="ok">¡Tienes 50%! Ya vas por la mitad.</p>` : "";
    const geo = SHOP.lat && "geolocation" in navigator && !store.get("geo")
      ? `<button class="ghost big" id="geo">Avisarme cuando llegue a la barbería</button>` : "";
    $("#cv").innerHTML = cardHTML(c) + msg +
      (c.wantsCut ? `<p class="hint">Ya avisaste a tu barbero que te toca corte.</p>`
        : `<div class="row"><button class="big" id="want">Me toca corte</button></div>`) +
      (geo ? `<div class="row">${geo}</div><p class="hint">El aviso de llegada funciona con esta página abierta.</p>` : "");
    $("#want")?.addEventListener("click", wantCut);
    $("#geo")?.addEventListener("click", () => { store.set("geo", "1"); watchArrival(); toast("Listo, te aviso al llegar"); $("#geo").remove(); });
  }, () => { $("#cv").innerHTML = `<p class="hint">No se pudo abrir la tarjeta.</p>`; });
  if (store.get("geo")) watchArrival();

  function wantCut() { updateDoc(doc(db, "clients", code), { wantsCut: true, wantsAt: Date.now() }).then(() => toast("Tu barbero ya sabe")).catch(() => toast("No se pudo avisar")); }
  function watchArrival() {
    navigator.geolocation.watchPosition((p) => {
      const R = 6371000, r = (x) => x * Math.PI / 180;
      const a = Math.sin(r(SHOP.lat - p.coords.latitude) / 2) ** 2 + Math.cos(r(p.coords.latitude)) * Math.cos(r(SHOP.lat)) * Math.sin(r(SHOP.lng - p.coords.longitude) / 2) ** 2;
      const dist = 2 * R * Math.asin(Math.sqrt(a));
      if (dist <= SHOP.radius && Date.now() - Number(store.get("last") || 0) > COOLDOWN_H * 36e5) {
        store.set("last", Date.now());
        sheet("¿Te toca corte?", "Estás al lado de tu barbería", [{ label: "Sí", fn: wantCut }, { label: "No", ghost: true }]);
      }
    }, () => toast("Activa la ubicación del navegador"), { enableHighAccuracy: true });
  }
}

/* ================== VISTA BARBERO ================== */
let list = [], unsub = null;
function barber() {
  onAuthStateChanged(auth, (u) => {
    unsub?.(); unsub = null;
    if (!u) return loginView();
    app.innerHTML = `<h1>Tus clientes</h1><div class="list" id="ls"></div>
      <div class="add"><input id="nn" placeholder="Nombre del cliente"><input id="nw" type="number" min="1" max="12" value="3" aria-label="Cada cuántas semanas">
      <input class="full" id="np" type="tel" placeholder="WhatsApp con lada (ej. 5265...)">
      <button class="full" id="add">Agregar cliente</button></div>
      <p class="hint">El número es cada cuántas semanas viene. Verde: al día. Ámbar: ya le toca.</p>
      <button class="link" id="out">Cerrar sesión</button>`;
    $("#add").onclick = addClient; $("#out").onclick = () => signOut(auth);
    unsub = onSnapshot(collection(db, "clients"), (s) => {
      list = s.docs.map((d) => ({ id: d.id, ...d.data() })).sort((a, b) => a.name.localeCompare(b.name));
      renderList();
    }, () => toast("No tienes permiso. Entra con la cuenta del barbero."));
  });
}
function loginView() {
  app.innerHTML = `<h1>Entrar como barbero</h1><input id="em" type="email" placeholder="Correo" autocapitalize="none">
    <input id="pw" type="password" placeholder="Contraseña" style="margin-top:10px"><div class="row"><button class="big" id="in">Entrar</button></div>`;
  $("#in").onclick = () => signInWithEmailAndPassword(auth, $("#em").value.trim(), $("#pw").value).catch((e) => { console.error(e); const m = { "auth/invalid-credential": "Correo o contraseña incorrectos", "auth/invalid-email": "El correo no es válido", "auth/user-not-found": "Ese usuario no existe en Firebase", "auth/wrong-password": "Contraseña incorrecta", "auth/operation-not-allowed": "Activa Correo y contraseña en Firebase", "auth/unauthorized-domain": "Falta autorizar este dominio en Firebase", "auth/invalid-api-key": "La apiKey de firebaseConfig no es válida", "auth/api-key-not-valid.-please-pass-a-valid-api-key.": "La apiKey de firebaseConfig no es válida", "auth/network-request-failed": "Sin conexión a Firebase" }; toast(m[e.code] || ("Error: " + (e.code || e.message))); });
}
const due = (x) => (Date.now() - x.last) / 864e5 >= x.weeks * 7;
function renderList() {
  $("#ls").innerHTML = list.length ? list.map((x, i) => `
    <div class="cl"><div class="ct"><div class="av" style="background:${COLORS[i % 6]}">${esc(x.name[0] || "?").toUpperCase()}</div>
      <div class="n"><b>${esc(x.name)}</b><small>cada ${x.weeks} semanas · ${x.stamps}/${GOAL} sellos</small>${x.wantsCut ? `<span class="want">Avisó que le toca corte</span>` : ""}</div>
      <span class="dot" style="background:${due(x) ? "var(--warn)" : "var(--ok)"}"></span></div>
      <div class="acts" data-id="${x.id}">
        <button class="mini" data-a="minus">− Quitar</button><button class="mini on" data-a="plus">+ Marcar corte</button>
        ${x.stamps >= GOAL ? `<button class="mini on" data-a="redeem">Canjear</button>` : ""}
        <button class="mini" data-a="link">Enviar enlace</button><button class="mini" data-a="del">Quitar cliente</button></div></div>`).join("")
    : `<div class="empty">Aún no tienes clientes.</div>`;
}
const clientLink = (id) => `${location.origin}${location.pathname}?c=${id}`;
async function addClient() {
  const name = $("#nn").value.trim();
  if (!name) return toast("Escribe el nombre del cliente");
  const id = crypto.randomUUID().replace(/-/g, "");
  const x = { name, weeks: Math.max(1, Math.min(12, +$("#nw").value || 3)), phone: $("#np").value.trim(), stamps: 0, last: Date.now(), wantsCut: false };
  await setDoc(doc(db, "clients", id), x);
  $("#nn").value = ""; $("#np").value = "";
  sendLink({ id, ...x });
}
function sendLink(x) {
  const text = `Hola ${x.name}, esta es tu tarjeta de sellos de la barbería: ${clientLink(x.id)}`;
  sheet("Enviar su tarjeta", `Le llegará a ${x.name} el enlace de su tarjeta.`, [
    { label: "Enviar por WhatsApp", fn: () => window.open(waLink(x.phone, text), "_blank") },
    { label: "Copiar enlace", ghost: true, fn: () => navigator.clipboard?.writeText(clientLink(x.id)).then(() => toast("Enlace copiado")) },
  ]);
}
function offerAviso(x, text, title) {
  sheet(title, "¿Le avisas por WhatsApp?", [
    { label: "Avisar por WhatsApp", fn: () => window.open(waLink(x.phone, text), "_blank") },
    { label: "Ahora no", ghost: true },
  ]);
}
app.addEventListener("click", async (e) => {
  const b = e.target.closest("[data-a]"); if (!b) return;
  const id = b.parentElement.dataset.id, x = list.find((k) => k.id === id); if (!x) return;
  const ref = doc(db, "clients", id), a = b.dataset.a;
  if (a === "plus" || a === "minus") {
    const next = Math.max(0, Math.min(GOAL, x.stamps + (a === "plus" ? 1 : -1)));
    await updateDoc(ref, { stamps: next, ...(a === "plus" ? { last: Date.now(), wantsCut: false } : {}) });
    if (a === "plus" && next !== x.stamps) {
      if (next === GOAL) offerAviso(x, `Hola ${x.name}, tienes un corte gratis ✂️`, `${x.name} ganó su corte gratis`);
      else if (next === HALF) offerAviso(x, `Hola ${x.name}, tienes 50% en tu tarjeta de sellos ✂️`, `${x.name} llegó al 50%`);
    }
  }
  if (a === "redeem") { await updateDoc(ref, { stamps: 0 }); toast("Corte gratis canjeado"); }
  if (a === "link") sendLink(x);
  if (a === "del") sheet(`¿Quitar a ${x.name}?`, "Su tarjeta dejará de funcionar.", [{ label: "Quitar", fn: () => deleteDoc(ref) }, { label: "Cancelar", ghost: true }]);
});

q.has("barbero") ? barber() : client();
</script>
</body>
</html>
